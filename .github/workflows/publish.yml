name: Publish and Create Tag and Release

on:
  workflow_dispatch: # Allows manual triggering of the action remotely

permissions: write-all

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'  # Only run for master branch
    permissions: write-all
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for version changes
        run: |
          # Fetch all tags from the remote repository
          git fetch --tags

          # Get the previous version from the last release tag
          export previous_version=$(git describe --tags --abbrev=0)

          # Get the current version from package.json
          export current_version=$(cat package.json | grep '"version":' | awk -F'"' '{print $4}')

          if [[ "$previous_version" != "v$current_version" ]]; then
            echo "Version has changed from $previous_version to v$current_version."
          else
            echo "Version has not changed."
            exit 1
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Publish package to npm
        run: echo "test"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create_tag:
    name: Create Git Tag
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'  # Only run for master branch
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push Git Tag
        run: echo "test"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'  # Only run for master branch
    needs: create_tag
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Release
        run: echo "test"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
