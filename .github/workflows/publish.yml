# Main Github Actions CI/CD file
name: Publish and Create Release

on:
  push:
    branches:
      - "master"
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Allocate memory and publish package
        run: | 
          export NODE_OPTIONS="--max-old-space-size=8192" && node -e 'console.log(v8.getHeapStatistics().heap_size_limit/(1024*1024))'
          npm i
          npm run npm-deploy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Create Release
        run: gh release create ${{ github.ref }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}