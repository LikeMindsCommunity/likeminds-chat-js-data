<h3 mat-dialog-title class="fw-bold">Block direct messaging?</h3>
<div mat-dialog-content class="content">
    Are you sure you do not want to receive new messages from {{name}}?
</div>
<mat-dialog-actions align="end" class="actions">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button (click)="confirm()" class="confirm">Confirm</button>
  </mat-dialog-actions>
